# Ocelado Linux gaming defaults (override in /etc/sysctl.d/)

# as SteamOS: some games (CS2, Hogwarts Legacy, DayZ...) need many memory
# mappings and crash with the kernel default
vm.max_map_count = 2147483642

# BBR + fq: better throughput and latency for downloads and online play
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
