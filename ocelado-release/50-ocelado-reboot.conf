# Ocelado Linux: never reboot on its own after an update (handhelds and
# gaming PCs: a reboot in the middle of a game or a download is worse than
# waiting). The desktop shows a notification instead
# (transactional-update-notifier); the new snapshot is used on the next
# reboot. Admins can override it in /etc/transactional-update.conf.
REBOOT_METHOD=notify
