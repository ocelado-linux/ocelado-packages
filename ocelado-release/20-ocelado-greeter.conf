# Ocelado Linux: SDDM greeter (login screen) on Wayland with KWin.
# There is no Xorg server (Wayland only), so the default X11 greeter fails.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
