# Ocelado Linux: break the systemd ordering cycle
#   graphical-session.target -> kde-baloo.service ->
#   plasma-workspace.target -> graphical-session.target
# plasma-workspace.target Wants= kde-baloo.service (implicit After=), and
# kde-baloo.service is After=graphical-session.target. Stopping
# graphical-session.target then fails ("Transaction order is cyclic"): the
# Plasma logout hangs and KWin survives into the next session (black
# screen). Same pattern as KDE bug 500017. Drop the default dependencies
# (After=graphical-session.target among them) and keep only the basic ones.
[Unit]
DefaultDependencies=no
Requires=basic.target
After=basic.target
Conflicts=shutdown.target
Before=shutdown.target
